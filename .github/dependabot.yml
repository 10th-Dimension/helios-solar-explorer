version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      vinext-rsc:
        patterns:
          - vinext
          - '@vitejs/plugin-rsc'
      tailwind:
        patterns:
          - tailwindcss
          - '@tailwindcss/postcss'
      three:
        patterns:
          - three
          - '@types/three'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      build-actions:
        patterns:
          - actions/checkout
          - actions/setup-node
