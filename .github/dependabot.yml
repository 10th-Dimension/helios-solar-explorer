version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      vinext-rsc:
        patterns:
          - vinext
          - '@vitejs/plugin-rsc'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
