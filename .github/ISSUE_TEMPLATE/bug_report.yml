name: Bug report
description: Report a reproducible issue without sensitive information.
body:
  - type: textarea
    id: reproduction
    attributes:
      label: What happened and how can we reproduce it?
      description: Include expected behavior and exact steps. Do not include credentials or personal logs.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, OS, viewport and graphics tier
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized screenshots or measurements
      description: Distinguish visual impressions from measured performance.
